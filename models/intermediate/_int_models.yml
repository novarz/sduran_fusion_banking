version: 2

models:
  - name: int_customer_segments
    description: >
      Análisis de segmentación de clientes basado en su comportamiento financiero,
      incluyendo saldos totales, número de productos y actividad transaccional.
    columns:
      - name: customer_id
        description: "Identificador único del cliente"
        tests:
          - unique
          - not_null
      - name: total_balance
        description: "Saldo total en todas las cuentas del cliente"
      - name: num_accounts
        description: "Número de cuentas del cliente"
      - name: num_products
        description: "Número de productos contratados"
      - name: segment_value
        description: "Clasificación de valor del cliente (High, Medium, Low)"

  - name: int_monthly_balances
    description: >
      Evolución mensual de saldos agregados por sucursal y tipo de producto.
      Útil para análisis de tendencias y reporting financiero.
    columns:
      - name: month_date
        description: "Mes de referencia"
      - name: branch_id
        description: "ID de la sucursal"
      - name: product_type
        description: "Tipo de producto"
      - name: total_balance
        description: "Saldo total agregado"
      - name: num_accounts
        description: "Número de cuentas"

  - name: int_transaction_summary
    description: >
      Resumen de transacciones por cuenta y categoría.
      Incluye totales de ingresos, gastos y número de operaciones.
    columns:
      - name: account_id
        description: "ID de la cuenta"
      - name: category
        description: "Categoría de la transacción"
      - name: total_credits
        description: "Total de abonos"
      - name: total_debits
        description: "Total de cargos"
      - name: num_transactions
        description: "Número de transacciones"

  - name: int_loan_enriched
    description: >
      Enriquecimiento de préstamos con datos de producto y cálculos financieros.
      Une stg_loans con stg_products y calcula métricas como TAE, amortización y nivel de riesgo.
      Este modelo centraliza la lógica de cálculo financiero antes de la capa de hechos.
    columns:
      - name: loan_id
        description: "Identificador único del préstamo"
        tests:
          - unique
          - not_null
      - name: tae
        description: >
          TAE (Tasa Anual Equivalente). Indicador del coste real del préstamo para el cliente.
          Según la Circular 5/2012 del Banco de España, DEBE incluir todos los costes:
          TIN + comisión de apertura + comisiones anuales (annual_fee) + seguros vinculados.
          Fórmula correcta: ((1 + (TIN + comisiones_anualizadas) / 12) ^ 12 - 1) * 100,
          donde comisiones_anualizadas = annual_fee / loan_amount.
          Validación: la diferencia TAE - TIN debe ser >= 0.25 pp en préstamos con comisiones.
          Una TAE igual al TIN indica que las comisiones NO están siendo incluidas en el cálculo.
      - name: annual_fee
        description: >
          Comisión anual del producto de préstamo. Disponible para incluir en el cálculo
          correcto de la TAE según normativa del Banco de España.
      - name: risk_level
        description: "Nivel de riesgo del préstamo (Alto, Medio, Bajo)"

  - name: int_loan_performance
    description: >
      Análisis del rendimiento de la cartera de préstamos.
      Incluye métricas de morosidad y rentabilidad por producto.
    columns:
      - name: product_id
        description: "ID del producto de préstamo"
      - name: total_loans
        description: "Número total de préstamos"
      - name: total_amount_lent
        description: "Importe total prestado"
      - name: total_outstanding
        description: "Saldo pendiente total"
      - name: default_rate
        description: "Tasa de morosidad"
      - name: interest_income
        description: "Ingresos por intereses estimados"
