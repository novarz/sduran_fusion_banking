version: 2

models:
  - name: metricflow_time_spine
    description: "Time spine requerido por MetricFlow para el Semantic Layer. Una fila por día, desde 5 años atrás hasta 30 días en el futuro."
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: "Columna base de fecha con granularidad diaria"
        granularity: day

semantic_models:
  # ==========================================================
  # SEMANTIC MODEL: TRANSACTIONS
  # Tabla de hechos de transacciones bancarias
  # ==========================================================
  - name: transactions
    description: >
      Modelo semántico de transacciones bancarias. Cada fila representa una transacción
      individual con detalles del importe, canal, tipo y estado.
    model: ref('fct_transactions')
    defaults:
      agg_time_dimension: transaction_date

    entities:
      - name: transaction
        type: primary
        expr: transaction_id
      - name: customer
        type: foreign
        expr: customer_id
      - name: account
        type: foreign
        expr: account_id

    dimensions:
      - name: transaction_date
        type: time
        type_params:
          time_granularity: day
      - name: transaction_type
        type: categorical
      - name: category
        type: categorical
      - name: channel
        type: categorical
      - name: status
        type: categorical
      - name: product_name
        type: categorical
      - name: product_type
        type: categorical
      - name: branch_name
        type: categorical
      - name: region
        type: categorical
      - name: is_excluded_from_metrics
        type: categorical

    measures:
      - name: total_transactions
        description: "Número total de transacciones"
        agg: count
        expr: transaction_id
      - name: transaction_volume
        description: "Volumen total de transacciones (suma de importes)"
        agg: sum
        expr: amount
      - name: total_commissions
        description: "Total de comisiones generadas"
        agg: sum
        expr: commission_amount
      - name: average_transaction_amount
        description: "Importe medio por transacción"
        agg: average
        expr: amount

  # ==========================================================
  # SEMANTIC MODEL: LOANS
  # Tabla de hechos de préstamos bancarios
  # ==========================================================
  - name: loans
    description: >
      Modelo semántico de préstamos bancarios. Cada fila representa un préstamo
      con detalles de amortización, riesgo y métricas financieras.
    model: ref('fct_loans')
    defaults:
      agg_time_dimension: start_date

    entities:
      - name: loan
        type: primary
        expr: loan_id
      - name: customer
        type: foreign
        expr: customer_id

    dimensions:
      - name: start_date
        type: time
        type_params:
          time_granularity: day
      - name: end_date
        type: time
        type_params:
          time_granularity: day
      - name: status
        type: categorical
      - name: customer_name
        type: categorical
      - name: customer_segment
        type: categorical
      - name: product_name
        type: categorical
      - name: loan_category
        type: categorical
      - name: branch_name
        type: categorical
      - name: region
        type: categorical
      - name: risk_level
        type: categorical

    measures:
      - name: total_loans_count
        description: "Número total de préstamos"
        agg: count
        expr: loan_id
      - name: total_loan_amount
        description: "Importe total prestado"
        agg: sum
        expr: loan_amount
      - name: average_loan_amount
        description: "Importe medio por préstamo"
        agg: average
        expr: loan_amount
      - name: average_interest_rate
        description: "Tipo de interés medio"
        agg: average
        expr: interest_rate
      - name: average_tae
        description: "TAE media"
        agg: average
        expr: tae
      - name: total_remaining_balance
        description: "Saldo pendiente total"
        agg: sum
        expr: remaining_balance
      - name: total_interest_paid
        description: "Intereses totales pagados"
        agg: sum
        expr: total_interest_paid

  # ==========================================================
  # SEMANTIC MODEL: CUSTOMERS
  # Dimensión de clientes bancarios
  # ==========================================================
  - name: customers
    description: >
      Modelo semántico de clientes bancarios. Cada fila representa un cliente
      con su información demográfica, segmentación y métricas de valor.
    model: ref('dim_customers')
    defaults:
      agg_time_dimension: customer_since

    entities:
      - name: customer
        type: primary
        expr: customer_id

    dimensions:
      - name: customer_since
        type: time
        type_params:
          time_granularity: day
      - name: full_name
        type: categorical
      - name: gender
        type: categorical
      - name: city
        type: categorical
      - name: state
        type: categorical
      - name: country
        type: categorical
      - name: customer_segment
        type: categorical
      - name: customer_value
        type: categorical

    measures:
      - name: total_customers
        description: "Número total de clientes"
        agg: count
        expr: customer_id

# ==============================================================
# METRICS
# ==============================================================
metrics:

  # ============================
  # MÉTRICAS SIMPLES (12)
  # ============================

  - name: total_transactions
    description: "Número total de transacciones realizadas"
    type: simple
    label: "Total Transacciones"
    type_params:
      measure: total_transactions

  - name: transaction_volume
    description: "Volumen total en euros de todas las transacciones"
    type: simple
    label: "Volumen de Transacciones"
    type_params:
      measure: transaction_volume

  - name: total_commissions
    description: "Total de comisiones bancarias generadas"
    type: simple
    label: "Total Comisiones"
    type_params:
      measure: total_commissions

  - name: average_transaction_amount
    description: "Importe medio por transacción"
    type: simple
    label: "Importe Medio Transacción"
    type_params:
      measure: average_transaction_amount

  - name: total_loans_count
    description: "Número total de préstamos en cartera"
    type: simple
    label: "Total Préstamos"
    type_params:
      measure: total_loans_count

  - name: total_loan_amount
    description: "Importe total de préstamos concedidos"
    type: simple
    label: "Importe Total Préstamos"
    type_params:
      measure: total_loan_amount

  - name: average_loan_amount
    description: "Importe medio por préstamo"
    type: simple
    label: "Importe Medio Préstamo"
    type_params:
      measure: average_loan_amount

  - name: average_interest_rate
    description: "Tipo de interés medio de los préstamos"
    type: simple
    label: "Tipo Interés Medio"
    type_params:
      measure: average_interest_rate

  - name: average_tae
    description: "Tasa Anual Equivalente media"
    type: simple
    label: "TAE Media"
    type_params:
      measure: average_tae

  - name: total_remaining_balance
    description: "Saldo pendiente total de todos los préstamos"
    type: simple
    label: "Saldo Pendiente Total"
    type_params:
      measure: total_remaining_balance

  - name: total_interest_paid
    description: "Total de intereses pagados por los prestatarios"
    type: simple
    label: "Total Intereses Pagados"
    type_params:
      measure: total_interest_paid

  - name: total_customers
    description: "Número total de clientes del banco"
    type: simple
    label: "Total Clientes"
    type_params:
      measure: total_customers

  # ============================
  # MÉTRICAS CON FILTROS (7)
  # ============================

  - name: completed_transactions
    description: "Transacciones completadas (excluye revertidas, pendientes y fallidas)"
    type: simple
    label: "Transacciones Completadas"
    type_params:
      measure: total_transactions
    filter:
      - "{{ Dimension('transaction__status') }} = 'completed'"
      - "{{ Dimension('transaction__is_excluded_from_metrics') }} = false"

  - name: credit_volume
    description: "Volumen de transacciones de crédito (abonos) completadas"
    type: simple
    label: "Volumen Créditos"
    type_params:
      measure: transaction_volume
    filter:
      - "{{ Dimension('transaction__transaction_type') }} = 'credit'"
      - "{{ Dimension('transaction__status') }} = 'completed'"
      - "{{ Dimension('transaction__is_excluded_from_metrics') }} = false"

  - name: debit_volume
    description: "Volumen de transacciones de débito (cargos) completadas"
    type: simple
    label: "Volumen Débitos"
    type_params:
      measure: transaction_volume
    filter:
      - "{{ Dimension('transaction__transaction_type') }} = 'debit'"
      - "{{ Dimension('transaction__status') }} = 'completed'"
      - "{{ Dimension('transaction__is_excluded_from_metrics') }} = false"

  - name: online_transactions
    description: "Número de transacciones completadas por canal online"
    type: simple
    label: "Transacciones Online"
    type_params:
      measure: total_transactions
    filter:
      - "{{ Dimension('transaction__channel') }} = 'Online'"
      - "{{ Dimension('transaction__status') }} = 'completed'"

  - name: active_loans
    description: "Número de préstamos activos actualmente"
    type: simple
    label: "Préstamos Activos"
    type_params:
      measure: total_loans_count
    filter:
      - "{{ Dimension('loan__status') }} = 'active'"

  - name: defaulted_loans
    description: "Número de préstamos en situación de morosidad"
    type: simple
    label: "Préstamos Morosos"
    type_params:
      measure: total_loans_count
    filter:
      - "{{ Dimension('loan__status') }} = 'defaulted'"

  - name: high_risk_loan_amount
    description: "Importe total de préstamos clasificados como alto riesgo"
    type: simple
    label: "Importe Préstamos Alto Riesgo"
    type_params:
      measure: total_loan_amount
    filter:
      - "{{ Dimension('loan__risk_level') }} = 'Alto'"

  # ============================
  # MÉTRICAS DERIVADAS (4)
  # ============================

  - name: default_rate
    description: "Tasa de morosidad: porcentaje de préstamos en impago sobre el total"
    type: derived
    label: "Tasa de Morosidad"
    type_params:
      expr: defaulted_loans / nullif(total_loans_count, 0)
      metrics:
        - name: defaulted_loans
        - name: total_loans_count

  - name: net_transaction_flow
    description: "Flujo neto de transacciones: diferencia entre créditos y débitos"
    type: derived
    label: "Flujo Neto Transacciones"
    type_params:
      expr: credit_volume - debit_volume
      metrics:
        - name: credit_volume
        - name: debit_volume

  - name: commission_rate
    description: "Tasa de comisiones: ratio de comisiones sobre volumen total"
    type: derived
    label: "Tasa de Comisiones"
    type_params:
      expr: total_commissions / nullif(transaction_volume, 0)
      metrics:
        - name: total_commissions
        - name: transaction_volume

  - name: loan_amortization_ratio
    description: "Ratio de amortización: proporción del préstamo ya amortizada"
    type: derived
    label: "Ratio de Amortización"
    type_params:
      expr: 1 - (total_remaining_balance / nullif(total_loan_amount, 0))
      metrics:
        - name: total_remaining_balance
        - name: total_loan_amount
