version: 2

models:
  - name: dim_customers
    description: >
      Dimensión de clientes bancarios. Una fila por cliente.
      Incluye información demográfica, métricas de valor y segmentación.
    columns:
      - name: customer_id
        description: "Identificador único del cliente"
        tests:
          - unique
          - not_null
      - name: dni
        description: "DNI/NIE del cliente"
        tests:
          - unique
      - name: email
        description: "Correo electrónico"
        tests:
          - unique
      - name: customer_segment
        description: "Segmento del cliente (Premium, Standard, Young, Senior)"
      - name: total_deposits
        description: "Saldo total en depósitos"
        tests:
          - not_null
      - name: customer_value
        description: "Clasificación de valor (High, Medium, Low)"

  - name: dim_products
    description: >
      Dimensión de productos bancarios. Una fila por producto.
      Incluye detalles del producto y métricas de uso.
    columns:
      - name: product_id
        description: "Identificador único del producto"
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Nombre del producto"
      - name: product_type
        description: "Tipo de producto"
      - name: num_accounts
        description: "Número de cuentas con este producto"
      - name: total_deposits
        description: "Saldo total en cuentas de este producto"

  - name: dim_branches
    description: >
      Dimensión de sucursales bancarias. Una fila por sucursal.
      Incluye ubicación y métricas de rendimiento agregadas.
    columns:
      - name: branch_id
        description: "Identificador único de la sucursal"
        tests:
          - unique
          - not_null
      - name: branch_code
        description: "Código de oficina"
        tests:
          - unique
      - name: total_customers
        description: "Total de clientes únicos"
      - name: total_deposits
        description: "Total de depósitos"
      - name: total_loans_outstanding
        description: "Saldo de préstamos pendiente"

  - name: fct_transactions
    description: >
      Tabla de hechos de transacciones. Una fila por transacción.
      Incluye detalles de la operación y métricas financieras.
      IMPORTANTE: Las transacciones revertidas (fraude) no deben incluirse en métricas de rentabilidad.
    columns:
      - name: transaction_id
        description: "Identificador único de la transacción"
        tests:
          - unique
          - not_null
      - name: account_id
        description: "ID de la cuenta"
      - name: customer_id
        description: "ID del cliente"
      - name: transaction_date
        description: "Fecha de la transacción"
      - name: amount
        description: "Importe de la transacción"
      - name: status
        description: "Estado de la transacción"
        tests:
          - accepted_values:
              arguments:
                values: ['completed', 'pending', 'reversed', 'failed']
      - name: commission_amount
        description: "Comisión aplicada a la transacción"

  - name: fct_loans
    description: >
      Tabla de hechos de préstamos. Una fila por préstamo.
      Incluye detalles del préstamo, amortización y métricas de riesgo.
      IMPORTANTE: La TAE debe calcularse correctamente incluyendo comisiones.
    columns:
      - name: loan_id
        description: "Identificador único del préstamo"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "ID del cliente"
        tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: loan_amount
        description: "Importe del préstamo"
      - name: status
        description: "Estado del préstamo"
        tests:
          - accepted_values:
              arguments:
                values: ['active', 'completed', 'defaulted']
      - name: remaining_balance
        description: "Saldo pendiente"
      - name: total_interest_paid
        description: "Intereses totales a pagar"
      - name: tae
        description: "Tasa Anual Equivalente"

exposures:
  - name: customer_analytics_dashboard
    label: Panel de Análisis de Clientes
    type: dashboard
    maturity: high
    url: https://looker.banco.es/dashboards/customer_analytics
    description: >
      Dashboard ejecutivo mostrando segmentación de clientes, análisis de valor
      de vida del cliente (CLV) y distribución geográfica.
      Usado por los equipos de marketing y banca personal para
      revisiones semanales de negocio.
    depends_on:
      - ref('dim_customers')
      - ref('fct_transactions')
    owner:
      name: Equipo de Analytics
      email: analytics@banco.es

  - name: loan_portfolio_report
    label: Informe de Cartera de Préstamos
    type: dashboard
    maturity: high
    url: https://looker.banco.es/dashboards/loan_portfolio
    description: >
      Dashboard de riesgos mostrando análisis de cartera, morosidad por producto
      y cumplimiento normativo (Banco de España). Usado por el equipo de riesgos
      para supervisión de la cartera crediticia.
    depends_on:
      - ref('fct_loans')
      - ref('dim_customers')
      - ref('dim_products')
    owner:
      name: Equipo de Riesgos
      email: riesgos@banco.es

  - name: branch_performance_report
    label: Informe de Rendimiento de Sucursales
    type: dashboard
    maturity: medium
    url: https://looker.banco.es/dashboards/branch_performance
    description: >
      Dashboard operativo mostrando KPIs de sucursales, captación de clientes
      y volumen de operaciones. Usado por dirección comercial para
      evaluación de red de oficinas.
    depends_on:
      - ref('dim_branches')
      - ref('fct_transactions')
      - ref('dim_customers')
    owner:
      name: Dirección Comercial
      email: comercial@banco.es
