version: 2

models:
  - name: dim_customers
    description: >
      Dimensión de clientes bancarios. Una fila por cliente. Incluye información demográfica, métricas de valor y segmentación.
    columns:
      - name: customer_id
        description: "Identificador único del cliente"
        tests:
          - unique
          - not_null
      - name: dni
        description: "DNI/NIE del cliente"
        tests:
          - unique
      - name: email
        description: "Correo electrónico"
        tests:
          - unique
      - name: customer_segment
        description: "Segmento del cliente (Premium, Standard, Young, Senior)"
      - name: total_deposits
        description: "Saldo total en depósitos"
        tests:
          - not_null
      - name: customer_value
        description: >
          Segmentación por valor basada en el saldo total de depósitos del cliente.
          High: depósitos > 50.000 EUR; Medium: entre 10.000 y 50.000 EUR; Low: < 10.000 EUR.
      - name: customer_since
        description: "Fecha de alta del cliente"
      - name: full_name
        description: "Nombre completo del cliente"
      - name: gender
        description: "Género del cliente"
      - name: city
        description: "Ciudad"
      - name: state
        description: "Comunidad autónoma"
      - name: country
        description: "País"

  - name: dim_products
    description: >
      Dimensión de productos bancarios. Una fila por producto.
      Incluye detalles del producto y métricas de uso.
    columns:
      - name: product_id
        description: "Identificador único del producto"
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Nombre del producto"
      - name: product_type
        description: "Tipo de producto"
      - name: num_accounts
        description: "Número de cuentas con este producto"
      - name: total_deposits
        description: "Saldo total en cuentas de este producto"

  - name: dim_branches
    description: >
      Dimensión de sucursales bancarias. Una fila por sucursal.
      Incluye ubicación y métricas de rendimiento agregadas.
    columns:
      - name: branch_id
        description: "Identificador único de la sucursal"
        tests:
          - unique
          - not_null
      - name: branch_code
        description: "Código de oficina"
        tests:
          - unique
      - name: total_customers
        description: "Total de clientes únicos"
      - name: total_deposits
        description: "Total de depósitos"
      - name: total_loans_outstanding
        description: "Saldo de préstamos pendiente"

  - name: fct_transactions
    description: >
      Tabla de hechos de transacciones. Una fila por transacción. Incluye detalles de la operación y métricas financieras.
      IMPORTANTE: Las transacciones revertidas (fraude) no deben incluirse en métricas de rentabilidad.
    columns:
      - name: transaction_id
        description: "Identificador único de la transacción"
        tests:
          - unique
          - not_null
      - name: account_id
        description: "ID de la cuenta"
      - name: customer_id
        description: "ID del cliente"
      - name: transaction_date
        description: "Fecha de la transacción"
      - name: amount
        description: "Importe de la transacción"
      - name: status
        description: "Estado de la transacción"
        tests:
          - accepted_values:
              arguments:
                values: ['completed', 'pending', 'reversed', 'failed']
      - name: commission_amount
        description: >
          Comisión aplicada a cada transacción según el canal utilizado.
          Reglas: ATM = 0.50 EUR fijo; POS = 1.5% del importe; Transfer = 0.25% (mín. 0.10 EUR);
          Online y Direct_Debit = sin comisión. Las comisiones incentivan el uso de canales digitales.
      - name: transaction_type
        description: "Tipo de transacción (credit/debit)"
      - name: category
        description: "Categoría de la transacción"
      - name: channel
        description: "Canal de la transacción"
      - name: product_name
        description: "Nombre del producto"
      - name: product_type
        description: "Tipo de producto"
      - name: branch_name
        description: "Nombre de la sucursal"
      - name: region
        description: "Región de la sucursal"
      - name: is_excluded_from_metrics
        description: "Flag para excluir de métricas de rentabilidad"

  - name: metricflow_time_spine
    description: "Time spine requerido por MetricFlow para el Semantic Layer. Una fila por día."
    columns:
      - name: date_day
        description: "Fecha"

  - name: fct_loans
    description: >
      Tabla de hechos de préstamos. Una fila por préstamo. Incluye detalles del préstamo, amortización y métricas de riesgo.
    columns:
      - name: loan_id
        description: "Identificador único del préstamo"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "ID del cliente"
        tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: loan_amount
        description: "Importe del préstamo"
      - name: status
        description: "Estado del préstamo"
        tests:
          - accepted_values:
              arguments:
                values: ['active', 'completed', 'defaulted']
      - name: remaining_balance
        description: "Saldo pendiente"
      - name: total_interest_paid
        description: >
          Importe total de intereses que el cliente pagará durante la vida del préstamo.
          Fórmula: total_interest_paid = (monthly_payment * term_months) - loan_amount.
      - name: tae
        description: "TAE (Tasa Anual Equivalente). Cálculo simplificado basado en el TIN."
      - name: start_date
        description: "Fecha de inicio del préstamo"
      - name: end_date
        description: "Fecha de vencimiento del préstamo"
      - name: customer_name
        description: "Nombre del cliente"
      - name: customer_segment
        description: "Segmento del cliente"
      - name: product_name
        description: "Nombre del producto"
      - name: loan_category
        description: "Categoría del préstamo"
      - name: branch_name
        description: "Nombre de la sucursal"
      - name: region
        description: "Región de la sucursal"
      - name: risk_level
        description: "Nivel de riesgo del préstamo"

  - name: rpt_loan_risk_summary
    description: >
      Resumen de riesgo de cartera de préstamos agregado por producto y región.
      Incluye métricas de TAE, morosidad y spread TAE-TIN para supervisión regulatoria.
    columns:
      - name: product_name
        description: "Nombre del producto de préstamo"
      - name: loan_category
        description: "Categoría del préstamo"
      - name: region
        description: "Región de la sucursal"
      - name: total_loans
        description: "Número total de préstamos"
      - name: total_loan_amount
        description: "Importe total de préstamos concedidos"
      - name: avg_tae
        description: "TAE media de los préstamos"
      - name: avg_interest_rate
        description: "Tipo de interés medio (TIN)"
      - name: tae_tin_spread
        description: "Diferencia media entre TAE y TIN. Valores bajos indican posible omisión de comisiones."
      - name: high_risk_loans
        description: "Número de préstamos de alto riesgo"
      - name: defaulted_loans
        description: "Número de préstamos en mora"
      - name: default_rate
        description: "Tasa de morosidad en porcentaje"

exposures:
  - name: customer_analytics_dashboard
    label: Panel de Análisis de Clientes
    type: dashboard
    maturity: high
    url: https://looker.banco.es/dashboards/customer_analytics
    description: >
      Dashboard ejecutivo mostrando segmentación de clientes, análisis de valor
      de vida del cliente (CLV) y distribución geográfica.
      Usado por los equipos de marketing y banca personal para
      revisiones semanales de negocio.
    depends_on:
      - ref('dim_customers')
      - ref('fct_transactions')
    owner:
      name: Equipo de Analytics
      email: analytics@banco.es

  - name: loan_portfolio_report
    label: Informe de Cartera de Préstamos
    type: dashboard
    maturity: high
    url: https://looker.banco.es/dashboards/loan_portfolio
    description: >
      Dashboard de riesgos mostrando análisis de cartera, morosidad por producto
      y cumplimiento normativo (Banco de España). Usado por el equipo de riesgos
      para supervisión de la cartera crediticia.
    depends_on:
      - ref('rpt_loan_risk_summary')
      - ref('dim_customers')
      - ref('dim_products')
    owner:
      name: Equipo de Riesgos
      email: riesgos@banco.es

  - name: branch_performance_report
    label: Informe de Rendimiento de Sucursales
    type: dashboard
    maturity: medium
    url: https://looker.banco.es/dashboards/branch_performance
    description: >
      Dashboard operativo mostrando KPIs de sucursales, captación de clientes
      y volumen de operaciones. Usado por dirección comercial para
      evaluación de red de oficinas.
    depends_on:
      - ref('dim_branches')
      - ref('fct_transactions')
      - ref('dim_customers')
    owner:
      name: Dirección Comercial
      email: comercial@banco.es
