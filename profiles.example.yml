# Copy to ~/.dbt/profiles.yml (never commit a real copy).
# Profile name must match dbt_project.yml: analytics
#
# Credentials are read from environment variables so this works on Cloud Agents
# via Secrets. Every var has a safe default, so `dbt parse` / `dbt ls` (the offline
# blast-radius flow) work with NO credentials. Real values are only needed for
# commands that hit the warehouse (`dbt debug` / `seed` / `run` / `test`).
#
# On Cloud Agents: add these in the Secrets panel (right-hand side of the chat):
#   SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PASSWORD, SNOWFLAKE_ROLE,
#   SNOWFLAKE_DATABASE, SNOWFLAKE_WAREHOUSE, SNOWFLAKE_SCHEMA
# Locally: export those vars, or just replace the env_var() calls with literals.

analytics:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'YOUR_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'YOUR_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'YOUR_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'FUSION_BANKING') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'DBT_WH') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'ANALYTICS_DEV') }}"
      threads: "{{ env_var('SNOWFLAKE_THREADS', '4') | int }}"
